<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haushaltsbuch</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#234F76">
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f3f5f8;color:#222}
header{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:#234F76;color:#fff}
header b{min-width:130px;text-align:center;text-transform:capitalize}header .sp{flex:1}
button{font:inherit;border:0;border-radius:6px;padding:7px 11px;background:#596984;color:#fff;cursor:pointer}
main{max-width:1250px;margin:auto;padding:10px}.card{background:#fff;border-radius:8px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}input,select{font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px;width:100%}
.pri{background:#234F76}#del{background:#b3261e}.sum{display:flex;gap:8px;margin-bottom:10px}.sum div{flex:1;background:#fff;padding:8px;border-radius:8px;display:flex;flex-direction:column;font-size:12px;box-shadow:0 1px 3px #0002}.sum b{font-size:17px}
.neg{color:#c00}nav{display:flex;gap:6px;margin-bottom:8px}nav button{background:#84B1F7}nav .on{background:#234F76}
.ln{display:flex;justify-content:space-between;gap:8px;margin:0;padding:8px 4px;border-bottom:1px solid #eee;align-items:center}.ln small{display:block;color:#777}.ln i{color:#234F76;font-weight:700;font-style:normal}
.ln input{width:110px;text-align:right;padding:4px}.tot{display:flex;justify-content:space-between;font-weight:700;margin:6px 4px 0}.mu{color:#888;margin:6px 4px}h3{margin:0 0 4px;background:#84B1F7;color:#fff;padding:6px 8px;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.tw{overflow:auto;max-height:75vh;background:#fff;border-radius:8px}table{border-collapse:collapse;font-size:12px;white-space:nowrap}
th{background:#234F76;color:#fff;padding:5px;position:sticky;top:0;z-index:2;white-space:normal;min-width:44px}th.g{background:#596984}th:first-child{left:0;z-index:3;min-width:28px}
td{padding:3px 5px;border:1px solid #fff;vertical-align:top;cursor:pointer}tr:nth-child(even) td{background:#eaeaea}td.n{text-align:right}tr.ft td{background:#99CCFF!important;font-weight:700}td span{cursor:pointer}td span:hover{text-decoration:underline}
dialog{border:0;border-radius:10px;width:min(420px,92vw)}dialog label{display:block;margin:8px 0 2px;font-size:13px}
</style></head><body>
<header><button id="pm">‹</button><b id="ml"></b><button id="nm">›</button><span class="sp"></span><button id="sy">⟳</button><button id="cf">⚙</button><button id="ex">⬇ Excel</button></header>
<main>
<section class="card"><form id="f"><div class="row"><input id="fa" inputmode="decimal" placeholder="Betrag €" required><input id="fd" type="date" required></div>
<div class="row"><select id="fc"></select><input id="ft" placeholder="Beschreibung"></div>
<div class="row"><button class="pri">Speichern</button><button type="button" id="del" hidden>Löschen</button><button type="button" id="cl" hidden>Abbrechen</button></div></form></section>
<div class="sum" id="sum"></div>
<nav><button data-v="l">Liste</button><button data-v="t">Tabelle</button></nav>
<div id="v"></div><div class="two" style="margin-top:10px"><section class="card" id="inc"></section><section class="card" id="sav"></section></div>
</main>
<dialog id="dg"><form method="dialog"><b>Sync via GitHub</b>
<label>Daten-Repo (privat), z. B. name/haushaltsbuch-daten</label><input id="gr">
<label>Fine-grained Token (Contents: Read &amp; Write)</label><input id="gt" type="password">
<label>Dateiname</label><input id="gp" placeholder="budget.json">
<div class="row" style="margin-top:12px"><button class="pri" id="gs">Speichern &amp; Sync</button><button value="x">Schließen</button></div></form></dialog>
<script src="exceljs.min.js"></script>
<script>
const CATS=[["wohnung","Wohnung / Internet / Fernsehen"],["transport","Transport"],["sport","Entertainment / Sport"],["kleidung","Kleidung / Körperpflege / Gesundheit"],["food","Lebensmittel"],["rest","Restaurants"],["out","Ausgehen / Freizeit"],["geschenke","Geschenke"],["urlaub","Urlaub"]];
const ACC=["Checking","Saving","Anlagen","PayPal","ABN Amro","Cash"];
const $=i=>document.getElementById(i),fm=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),sm=a=>a.reduce((p,x)=>p+x.a,0),
esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
p2=n=>String(n).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let S=JSON.parse(localStorage.hb||'{"e":{},"i":{},"s":{}}'),cfg=JSON.parse(localStorage.hbcfg||'{}'),view=innerWidth<700?'l':'t',tm;
const now=new Date();let month=now.getFullYear()+'-'+p2(now.getMonth()+1);
const E=()=>Object.values(S.e).filter(x=>!x.x&&x.m==month),I=()=>Object.values(S.i).filter(x=>!x.x&&x.m==month);
$('fc').innerHTML=CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')+'<option value="_i">➕ Einnahme</option>';
const today=()=>now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());
function clear(){$('f').dataset.id='';$('fa').value=$('ft').value='';$('del').hidden=$('cl').hidden=true}
function save(){localStorage.hb=JSON.stringify(S);render();clearTimeout(tm);tm=setTimeout(sync,1500)}
function load(id){const r=S.e[id]||S.i[id];if(!r)return;$('f').dataset.id=id;$('fa').value=r.a;$('ft').value=r.t;$('fc').value=r.c||'_i';$('fd').value=r.m+'-'+p2(r.d||1);$('del').hidden=$('cl').hidden=false;scrollTo(0,0)}
$('f').onsubmit=e=>{e.preventDefault();const a=parseFloat($('fa').value.replace(',','.'));if(isNaN(a))return;const old=$('f').dataset.id,u=Date.now(),[y,m,d]=$('fd').value.split('-'),id=uid(),mk=y+'-'+m;
if(old){(S.e[old]||S.i[old]).x=1;(S.e[old]||S.i[old]).u=u}
if($('fc').value=='_i')S.i[id]={id,m:mk,t:$('ft').value||'Einnahme',a,u};else S.e[id]={id,m:mk,d:+d,c:$('fc').value,t:$('ft').value,a,u};
month=mk;clear();save()};
$('del').onclick=()=>{const r=S.e[$('f').dataset.id]||S.i[$('f').dataset.id];r.x=1;r.u=Date.now();clear();save()};$('cl').onclick=clear;
$('pm').onclick=()=>step(-1);$('nm').onclick=()=>step(1);
function step(k){const[y,m]=month.split('-');const d=new Date(y,m-1+k);month=d.getFullYear()+'-'+p2(d.getMonth()+1);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$('v').onclick=$('inc').onclick=ev=>{const s=ev.target.closest('[data-id]');if(s)return load(s.dataset.id);const c=ev.target.closest('td[data-c]');if(c){clear();$('fd').value=month+'-'+p2(c.dataset.d);$('fc').value=c.dataset.c;$('fa').focus()}};
$('sav').onchange=ev=>{const k=ev.target.dataset.k;if(!k)return;S.s[month+'|'+k]={a:parseFloat(ev.target.value.replace(',','.'))||0,u:Date.now()};save()};
const list=e=>e.sort((p,q)=>q.d-p.d||q.u-p.u).map(x=>`<p class="ln card" style="margin:0 0 4px" data-id="${x.id}"><span><i>${x.d}.</i> ${esc(x.t)||'–'}<small>${CATS.find(c=>c[0]==x.c)[1]}</small></span><b>${fm(x.a)}</b></p>`).join('')||'<p class="mu">Noch keine Einträge</p>';
function table(e){const[y,m]=month.split('-'),n=new Date(y,m,0).getDate();let rem=sm(I()),tot=0,h='<div class="tw"><table><tr><th></th>'+CATS.map(c=>`<th colspan="2">${c[1]}</th>`).join('')+'<th class="g">Daily Total</th><th class="g">Remaining</th><th class="g">Total Spent</th></tr>';
for(let d=1;d<=n;d++){const de=e.filter(x=>x.d==d),dy=sm(de);rem-=dy;tot+=dy;
h+=`<tr><th>${d}</th>`+CATS.map(c=>{const l=de.filter(x=>x.c==c[0]),sp=f=>l.map(x=>`<span data-id="${x.id}">${f(x)}</span>`).join('<br>');return `<td data-d="${d}" data-c="${c[0]}">${sp(x=>esc(x.t)||'·')}</td><td class="n" data-d="${d}" data-c="${c[0]}">${sp(x=>x.a.toFixed(2))}</td>`}).join('')+`<td class="n">${dy?dy.toFixed(2):''}</td><td class="n ${rem<0?'neg':''}">${fm(rem)}</td><td class="n">${fm(tot)}</td></tr>`}
return h+'<tr class="ft"><th></th>'+CATS.map(c=>`<td></td><td class="n">${sm(e.filter(x=>x.c==c[0])).toFixed(2)}</td>`).join('')+`<td class="n">${tot.toFixed(2)}</td><td></td><td></td></tr></table></div>`}
function render(){const[y,m]=month.split('-'),e=E(),i=I(),ex=sm(e),inc=sm(i),sv=ACC.map(k=>S.s[month+'|'+k]?.a||0);
$('ml').textContent=new Date(y,m-1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
$('sum').innerHTML=`<div>Einnahmen<b>${fm(inc)}</b></div><div>Ausgaben<b>${fm(ex)}</b></div><div>Übrig<b class="${inc-ex<0?'neg':''}">${fm(inc-ex)}</b></div>`;
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
$('v').innerHTML=view=='l'?list(e):table(e);
$('inc').innerHTML='<h3>Einnahmen</h3>'+(i.map(x=>`<p class="ln" data-id="${x.id}"><span>${esc(x.t)}</span><b>${fm(x.a)}</b></p>`).join('')||'<p class="mu">–</p>')+`<p class="tot"><span>Total</span><b>${fm(inc)}</b></p>`;
$('sav').innerHTML='<h3>Savings</h3>'+ACC.map((k,j)=>`<label class="ln"><span>${k}</span><input inputmode="decimal" data-k="${k}" value="${sv[j]||''}"></label>`).join('')+`<p class="tot"><span>Total</span><b>${fm(sv.reduce((p,x)=>p+x,0))}</b></p>`}
// ---- Sync (GitHub-Repo als Speicher) ----
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const gh=(m,b)=>fetch(`https://api.github.com/repos/${cfg.repo}/contents/${cfg.path||'budget.json'}`,{method:m,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:b?JSON.stringify(b):undefined});
function merge(R){for(const t of['e','i','s'])for(const k in R[t]||{})if(!S[t][k]||R[t][k].u>S[t][k].u)S[t][k]=R[t][k]}
async function sync(n=0){if(!cfg.repo||!cfg.token)return $('sy').textContent='⟳ –';$('sy').textContent='⟳ …';
try{const r=await gh('GET');let sha,rt;if(r.ok){const j=await r.json();sha=j.sha;rt=dec(j.content);merge(JSON.parse(rt))}else if(r.status!=404)throw r.status;
localStorage.hb=JSON.stringify(S);render();const txt=JSON.stringify(S);
if(txt!=rt){const p=await gh('PUT',{message:'sync',content:enc(txt),sha});if((p.status==409||p.status==422)&&n<3)return sync(n+1);if(!p.ok)throw p.status}
$('sy').textContent='✓ Sync'}catch(e){$('sy').textContent='⚠ '+e}}
$('sy').onclick=()=>sync();$('cf').onclick=()=>{$('gr').value=cfg.repo||'';$('gt').value=cfg.token||'';$('gp').value=cfg.path||'';$('dg').showModal()};
$('gs').onclick=()=>{cfg={repo:$('gr').value.trim(),token:$('gt').value.trim(),path:$('gp').value.trim()};localStorage.hbcfg=JSON.stringify(cfg);sync()};
addEventListener('online',()=>sync());document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
// ---- Excel-Export im Layout der Vorlage ----
$('ex').onclick=async()=>{const[y,m]=month.split('-'),n=new Date(y,m,0).getDate(),e=E(),ic=I(),wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(month);
const col=c=>ws.getColumn(c).letter,fl=r=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+r}}),EU='#,##0.00\\ [$€-1];[Red]\\-#,##0.00\\ [$€-1]',
hd=(r,c,v,bg)=>{const z=ws.getCell(r,c);z.value=v;z.fill=fl(bg);z.font={bold:true,color:{argb:'FFFFFFFF'}};z.alignment={wrapText:true,horizontal:'center',vertical:'middle'}},
bold=(r,c,v,f)=>{const z=ws.getCell(r,c);z.value=v;z.font={bold:true};if(f)z.fill=fl(f);return z};
CATS.forEach((c,i)=>{ws.mergeCells(1,2+2*i,1,3+2*i);hd(1,2+2*i,c[1],'234F76');ws.getColumn(2+2*i).width=16;ws.getColumn(3+2*i).width=9});
['Daily Total','Remaining','Total Spent'].forEach((v,i)=>{hd(1,20+i,v,'596984');ws.getColumn(20+i).width=13});
ws.mergeCells(1,24,1,25);hd(1,24,'Einnahmen','84B1F7');ws.getColumn(24).width=18;ws.getColumn(25).width=14;ws.getColumn(1).width=4;ws.getRow(1).height=48;
const slots=Math.max(9,ic.length),tr=slots+2,T=n+2;let rem=sm(ic),tot=0;
for(let d=1;d<=n;d++){const r=d+1,de=e.filter(x=>x.d==d),dy=sm(de);rem-=dy;tot+=dy;hd(r,1,d,'234F76');
CATS.forEach((c,i)=>{const l=de.filter(x=>x.c==c[0]);if(!l.length)return;ws.getCell(r,2+2*i).value=l.map(x=>x.t).filter(Boolean).join(', ');ws.getCell(r,3+2*i).value=l.length>1?{formula:l.map(x=>x.a).join('+'),result:sm(l)}:l[0].a});
ws.getCell(r,20).value={formula:CATS.map((c,i)=>col(3+2*i)+r).join('+'),result:dy};
ws.getCell(r,21).value={formula:d==1?`Y${tr}-T${r}`:`U${r-1}-T${r}`,result:rem};
ws.getCell(r,22).value={formula:d==1?`T${r}`:`V${r-1}+T${r}`,result:tot};
for(let c=2;c<=22;c++){const z=ws.getCell(r,c);if(r%2==0)z.fill=fl('EAEAEA');if(c>=20)z.numFmt=c==20?'0.00':EU;else if(c%2==1)z.numFmt='0.00'}}
CATS.forEach((c,i)=>{const k=3+2*i,z=bold(T,k,{formula:`SUM(${col(k)}2:${col(k)}${n+1})`,result:sm(e.filter(q=>q.c==c[0]))},'99CCFF');z.numFmt='0.00'});
bold(T,20,{formula:`SUM(T2:T${n+1})`,result:tot},'99CCFF').numFmt='0.00';
for(let k=0;k<slots;k++){const r=k+2,z=ic[k];if(z){ws.getCell(r,24).value=z.t;ws.getCell(r,25).value=z.a}ws.getCell(r,25).numFmt='0.00';if(r%2==0){ws.getCell(r,24).fill=ws.getCell(r,25).fill=fl('EAEAEA')}}
bold(tr,24,'Total');ws.getCell(tr,25).value={formula:`SUM(Y2:Y${tr-1})`,result:sm(ic)};
const sh=tr+2;ws.mergeCells(sh,24,sh,25);hd(sh,24,'Savings','84B1F7');let st=0;
ACC.forEach((k,j)=>{const r=sh+1+j,v=S.s[month+'|'+k]?.a||0;st+=v;ws.getCell(r,24).value=k;ws.getCell(r,25).value=v;ws.getCell(r,25).numFmt='0.00';if(j%2==0)ws.getCell(r,24).fill=ws.getCell(r,25).fill=fl('EAEAEA')});
bold(sh+7,24,'Total');ws.getCell(sh+7,25).value={formula:`SUM(Y${sh+1}:Y${sh+6})`,result:st};
ws.views=[{state:'frozen',xSplit:1,ySplit:1}];
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await wb.xlsx.writeBuffer()]));a.download=`Haushaltsbuch_${month}.xlsx`;a.click()};
$('fd').value=today();render();sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
